apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-goldensignals
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  golden-signals.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Traffic (RPS) per service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"default\"}[1m])) by (destination_service_name)",
              "legendFormat": "{{destination_service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "title": "Errors (5xx %) per service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "100 * (sum(rate(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"default\", response_code=~\"5..\"}[1m])) by (destination_service_name) or 0 * sum(rate(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"default\"}[1m])) by (destination_service_name)) / sum(rate(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"default\"}[1m])) by (destination_service_name)",
              "legendFormat": "{{destination_service_name}} 5xx %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          }
        },
        {
          "title": "Latency (p95) per service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", destination_workload_namespace=\"default\"}[1m])) by (le, destination_service_name))",
              "legendFormat": "{{destination_service_name}} p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          }
        },
        {
          "title": "Saturation (CPU cores per pod)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\", container!=\"POD\", namespace=\"default\"}[1m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "title": "Responses by code (all services)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\", destination_workload_namespace=\"default\"}[1m])) by (destination_service_name, response_code)",
              "legendFormat": "{{destination_service_name}} {{response_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "title": "Available replicas (self-healing)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"default\"}",
              "legendFormat": "{{deployment}}"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "observability",
        "golden-signals",
        "istio"
      ],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timezone": "",
      "title": "Microservices Golden Signals Dashboard",
      "version": 2
    }
